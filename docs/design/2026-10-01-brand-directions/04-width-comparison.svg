<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#ECE7DC"/><text x="70" y="65" fill="#151C29" font-family="Segoe UI,Arial,sans-serif" font-size="38">Промежуток остаётся прежним</text><text x="70" y="110" fill="#151C29" font-family="Segoe UI,Arial,sans-serif" font-size="23">Расширяются только внешние края двух прорезей</text><text x="85" y="185" fill="#151C29" font-family="Segoe UI,Arial,sans-serif" font-size="25">Было</text><text x="755" y="185" fill="#151C29" font-family="Segoe UI,Arial,sans-serif" font-size="25">Линии утолщены</text><g transform="translate(80 210) scale(4.8)"><g transform="translate(4 0) skewX(-7)"><defs><mask id="before" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" rx="0" fill="white"/><path d="M6 110L96 -10 M49.5 60L102 -10" fill="none" stroke="black" stroke-width="2.0" stroke-linecap="butt" stroke-linejoin="miter"/></mask></defs><g mask="url(#before)"><path d="M5 18H23L40 42L58 18H75L48 54V84H31V54Z M48 54L75 18H95V84H78V42L63 62Z" fill="#151C29"/></g></g></g><g transform="translate(750 210) scale(4.8)"><g transform="translate(4 0) skewX(-7)"><defs><mask id="after" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" rx="0" fill="white"/><path d="M5.5 110L95.5 -10 M50 60L102.5 -10" fill="none" stroke="black" stroke-width="2.8" stroke-linecap="butt" stroke-linejoin="miter"/></mask></defs><g mask="url(#after)"><path d="M5 18H23L40 42L58 18H75L48 54V84H31V54Z M48 54L75 18H95V84H78V42L63 62Z" fill="#151C29"/></g></g></g><text x="70" y="760" fill="#151C29" font-family="Segoe UI,Arial,sans-serif" font-size="24">В обеих версиях расстояние между внутренними краями одинаковое.</text><text x="70" y="807" fill="#151C29" font-family="Segoe UI,Arial,sans-serif" font-size="24">Справа толщина каждой прорези доведена до ширины этого промежутка.</text></svg>